<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient glowing spheres -->
  <circle cx="200" cy="150" r="100" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="350" r="120" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

  <!-- Mock Browser/Editor Window Frame -->
  <rect x="50" y="50" width="700" height="400" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" />
  
  <!-- Browser Title Bar -->
  <path d="M50 66 C50 58, 58 50, 66 50 H734 C742 50, 750 58, 750 66 V90 H50 Z" fill="#0f172a" fill-opacity="0.8" />
  
  <!-- Dots (Window controls) -->
  <circle cx="80" cy="70" r="6" fill="#ef4444" />
  <circle cx="100" cy="70" r="6" fill="#f59e0b" />
  <circle cx="120" cy="70" r="6" fill="#10b981" />
  
  <!-- Browser Address/Title text -->
  <rect x="180" y="60" width="440" height="20" rx="6" fill="#1e293b" fill-opacity="0.9" />
  <text x="400" y="74" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" text-anchor="middle">vibe-coding-portfolio.edu</text>

  <!-- Content area inside window -->
  <!-- Code bracket graphics -->
  <text x="400" y="220" fill="url(#accentGrad)" font-family="'Outfit', system-ui, sans-serif" font-weight="800" font-size="72" text-anchor="middle" filter="url(#glow)" opacity="0.8">&lt; / &gt;</text>

  <!-- Big Coming Soon Title -->
  <text x="400" y="290" fill="url(#textGrad)" font-family="'Noto Sans TC', 'Outfit', sans-serif" font-weight="700" font-size="28" text-anchor="middle" letter-spacing="2">作品準備中</text>
  
  <!-- Subtitle -->
  <text x="400" y="325" fill="#64748b" font-family="'Noto Sans TC', 'Outfit', sans-serif" font-weight="400" font-size="16" text-anchor="middle" letter-spacing="1">Coding in progress... Stay tuned!</text>

  <!-- Mock status bar at the bottom -->
  <rect x="50" y="420" width="700" height="30" rx="0" fill="#0f172a" fill-opacity="0.6" />
  <text x="70" y="439" fill="#475569" font-family="'Outfit', sans-serif" font-size="11">UTF-8</text>
  <text x="130" y="439" fill="#475569" font-family="'Outfit', sans-serif" font-size="11">HTML / CSS / JS</text>
  <text x="730" y="439" fill="#475569" font-family="'Outfit', sans-serif" font-size="11" text-anchor="end">Status: Ready to Code</text>
</svg>
